version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: sayar_db
      POSTGRES_USER: sayar_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sayar.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sayar_user:password@postgres:5432/sayar_db
    depends_on:
      - postgres
    volumes:
      - .:/app

volumes:
  postgres_data: